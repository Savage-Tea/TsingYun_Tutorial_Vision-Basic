services:
  basic-runtime:
    image: basic:deploy
    build:
      context: ..
      dockerfile: docker/Dockerfile.deploy
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 5s
    volumes:
      - .ros:/root/.ros:rw
    working_dir: /workspace/code
    container_name: basic-deploy
    command: ["/bin/bash", "-lc", "source /workspace/code/install/setup.bash && exec ros2 launch basic_topic basic_topic.launch.py"]
    healthcheck:
      test: ["CMD-SHELL", ". /workspace/code/install/setup.bash && ros2 node list >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
